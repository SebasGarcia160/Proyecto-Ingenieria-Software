<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Registro</title>
  <link rel="stylesheet" href="styles-register.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>Registro</h2>
    <form id="registerForm">
      <label for="username">Nombre de Usuario</label>
      <input type="text" id="username" placeholder="Ingresa tu nombre de usuario" required>

      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" placeholder="Ingresa tu correo" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

      <!-- Casilla de verificación para aceptar términos y privacidad -->
      <div class="terms-container">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          Acepto los <a href="#" target="_blank">términos y condiciones</a> y la <a href="#" target="_blank">política de privacidad</a>.
        </label>
      </div>

      <button type="submit">Registrarse</button>
      <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </form>
  </div>
</body>
</html>
