<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="styles-login.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">
      <!-- Reemplaza esto con la imagen de tu logo -->
      <img src="assets/logo (2).png" alt="Logo de la App" style="width: 150px; height: auto;">
    </div>

    <!-- Mensaje de bienvenida -->
    <h2>Iniciar Sesión</h2>
    <p class="welcome-msg">¡Hola, qué gusto verte!</p>

    <!-- Formulario de inicio de sesión -->
    <form id="loginForm">
      <label for="email">Correo Electrónico:</label>
      <input type="email" id="email" placeholder="Ingresa tu correo" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

      <button type="submit">Iniciar Sesión</button>
    </form>

    <!-- Opciones de inicio de sesión alternativo -->
    <p class="alternative-login">o usa tus cuentas asociadas</p>
    <div class="social-login">
      <!-- Botones de inicio de sesión con Gmail y administrador en la misma línea -->
      <button class="social-btn gmail-btn">
        <img src="assets/gmail.png" alt="Gmail Icono" class="icon"> Gmail
      </button>
      <button class="social-btn admin-btn">Ingresar como administrador</button>
    </div>

    <!-- Enlaces para recuperar contraseña o registrarse -->
    <div class="extra-links">
      <a href="#">¿Olvidaste la contraseña?</a> | <a href="register.html">Registrarse</a>
    </div>
  </div>
</body>
</html>
